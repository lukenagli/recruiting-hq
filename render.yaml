# Render blueprint for the hosted site. Values marked sync: false are entered in Render's dashboard.
services:
  - type: web
    name: recruiting-hq
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # The course key. Only the site's admin account (the first one created) ever uses it;
      # everyone else adds their own Claude or OpenAI key in Settings.
      - key: PORTKEY_API_KEY
        sync: false
      # Encrypts the API keys people save. Generated once by Render; changing it means everyone re-enters their key.
      - key: APP_SECRET
        generateValue: true
      - key: DAILY_TOKEN_BUDGET
        value: "400000"
      - key: LITESTREAM_BUCKET
        sync: false
      - key: LITESTREAM_ENDPOINT
        sync: false
      - key: LITESTREAM_REGION
        sync: false
      - key: LITESTREAM_ACCESS_KEY_ID
        sync: false
      - key: LITESTREAM_SECRET_ACCESS_KEY
        sync: false
