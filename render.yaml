# Render blueprint for the hosted site. Values marked sync: false are entered in Render's dashboard.
services:
  - type: web
    name: recruiting-hq-app
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # The course key. Only the site's admin account (the first one created) and the teaching staff's demo
      # account (backend/demo.py) use it; everyone else adds their own key in Settings.
      - key: PORTKEY_API_KEY
        sync: false
      # Encrypts the API keys people save. Generated once by Render; changing it means everyone re-enters their key.
      - key: APP_SECRET
        generateValue: true
      - key: DAILY_TOKEN_BUDGET
        value: "400000"
      - key: LITESTREAM_BUCKET
        sync: false
      - key: LITESTREAM_ENDPOINT
        sync: false
      - key: LITESTREAM_REGION
        sync: false
      - key: LITESTREAM_ACCESS_KEY_ID
        sync: false
      - key: LITESTREAM_SECRET_ACCESS_KEY
        sync: false
      # Email for sign-up codes and password resets (any SMTP account with an app password, e.g.
      # smtp.mail.yahoo.com / 465 or smtp.gmail.com / 587). Leave all five empty to turn email off: the site
      # then skips email confirmation and password reset is off.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Or send through the Gmail API (works from cloud servers, where Google refuses SMTP password logins).
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
