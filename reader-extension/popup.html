<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 14px/1.45 'Segoe UI', system-ui, sans-serif; width: 340px; margin: 0; padding: 14px 16px; color: #101a2e; }
      h1 { font-size: 16px; margin: 0 0 4px; }
      .safe { background: #e2f5ec; color: #17875a; border-radius: 8px; padding: 7px 10px; font-size: 12.5px; font-weight: 600; margin: 8px 0 12px; }
      label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
      input { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1.5px solid #e1e5ee; border-radius: 8px; font: inherit; }
      button { margin-top: 8px; padding: 7px 14px; border-radius: 8px; border: 0; background: #2563eb; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      button.ghost { background: #eef0f5; color: #101a2e; }
      .status { margin-top: 12px; font-size: 12.5px; color: #5d6880; white-space: pre-wrap; max-height: 220px; overflow: auto; }
      small { color: #5d6880; }
    </style>
  </head>
  <body>
    <h1>Recruiting HQ Reader</h1>
    <small>When you press Refresh on Recruiting HQ (or Sync now here), it reads what's new in your Outlook, Slack and WhatsApp and files it there. It reads in a minimized window of its own and closes it when it's done.</small>
    <div class="safe">Read only. It cannot send, reply, react or type anywhere.</div>
    <label for="key">Reader key <small>(from Recruiting HQ → Settings)</small></label>
    <input id="key" type="password" autocomplete="off" placeholder="Paste your reader key" />
    <button id="save" class="ghost">Save key</button>
    <button id="sync">Sync now</button>
    <div class="status" id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
